<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TajNet-AI-X</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #1e3a8a);
      color: #111827;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
      padding: 25px 15px;
    }

    .card {
      background: white;
      border-radius: 24px;
      padding: 25px;
      margin-top: 25px;
      box-shadow: 0 10px 35px rgba(0,0,0,.20);
    }

    .logo {
      text-align: center;
      font-size: 45px;
    }

    h1 {
      text-align: center;
      margin: 8px 0;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 2px solid #e5e7eb;
      border-radius: 13px;
      font-size: 18px;
      text-align: center;
      text-transform: uppercase;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 18px;
      border: 0;
      border-radius: 13px;
      background: #2563eb;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

    button:disabled {
      opacity: .6;
    }

    .logout {
      background: #dc2626;
    }

    .message {
      margin-top: 15px;
      padding: 14px;
      border-radius: 12px;
      display: none;
      line-height: 1.5;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    .info {
      display: block !important;
      background: #dbeafe;
      color: #1e40af;
    }

    .role {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    .menu {
      display: grid;
      gap: 12px;
    }

    .menu button {
      margin-top: 0;
    }

    .director {
      background: #111827;
    }

    .supervisor {
      background: #7c3aed;
    }

    .requester {
      background: #059669;
    }

    .hidden {
      display: none !important;
    }

    .store {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 15px;
      margin-top: 12px;
    }

    .request {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 15px;
      margin-top: 12px;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      padding: 14px;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 16px;
      resize: vertical;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- LOGIN -->
  <div id="loginPanel" class="card">

    <div class="logo">🏪</div>

    <h1>TajNet-AI-X</h1>

    <div class="subtitle">
      Системаи идоракунии мағозаҳо
    </div>

    <label>
      🔐 Коди махсус
    </label>

    <input
      id="accessCode"
      type="text"
      placeholder="Масалан: DIR-2026-001"
      autocomplete="off"
    >

    <button
      id="loginButton"
      onclick="loginByCode()"
    >
      🔑 Ворид шудан
    </button>

    <div
      id="loginMessage"
      class="message"
    ></div>

  </div>


  <!-- DIRECTOR -->
  <div
    id="directorPanel"
    class="card hidden"
  >

    <div class="role">
      👨‍💼 Панели директор
    </div>

    <p>
      Хуш омадед,
      <b id="directorName"></b>
    </p>

    <div class="menu">

      <button
        class="director"
        onclick="showStores()"
      >
        🏪 Мағозаҳо
      </button>

      <button
        class="director"
        onclick="showStaff()"
      >
        👥 Супервайзерҳо ва заявщикҳо
      </button>

      <button
        class="director"
        onclick="showRequests()"
      >
        📋 Заявкаҳо
      </button>

    </div>

    <div id="directorContent"></div>

    <button
      class="logout"
      onclick="logout()"
    >
      🚪 Баромадан
    </button>

  </div>


  <!-- SUPERVISOR -->
  <div
    id="supervisorPanel"
    class="card hidden"
  >

    <div class="role">
      🧑‍💼 Панели супервайзер
    </div>

    <p>
      Хуш омадед,
      <b id="supervisorName"></b>
    </p>

    <div class="menu">

      <button
        class="supervisor"
        onclick="supervisorStores()"
      >
        🏪 Мағозаҳо
      </button>

      <button
        class="supervisor"
        onclick="supervisorRequests()"
      >
        📋 Заявкаҳо
      </button>

    </div>

    <div id="supervisorContent"></div>

    <button
      class="logout"
      onclick="logout()"
    >
      🚪 Баромадан
    </button>

  </div>


  <!-- REQUESTER -->
  <div
    id="requesterPanel"
    class="card hidden"
  >

    <div class="role">
      📝 Панели заявщик
    </div>

    <p>
      Хуш омадед,
      <b id="requesterName"></b>
    </p>

    <label>
      Номи заявка
    </label>

    <input
      id="requestTitle"
      type="text"
      placeholder="Масалан: Дархости мол"
    >

    <label style="margin-top:18px;">
      Тавсиф
    </label>

    <textarea
      id="requestDescription"
      placeholder="Маълумоти заявка..."
    ></textarea>

    <button
      class="requester"
      onclick="sendRequest()"
    >
      📤 Фиристодани заявка
    </button>

    <div
      id="requestMessage"
      class="message"
    ></div>

    <div id="myRequests"></div>

    <button
      class="logout"
      onclick="logout()"
    >
      🚪 Баромадан
    </button>

  </div>

</div>


<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://hyfcgiipstcuobjtnyvz.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_C6rL2SmXOXwU8ZzJoX4z0Q_1OvXGPFu";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   CURRENT STAFF
   ===================================================== */

let currentStaff = null;


/* =====================================================
   ELEMENTS
   ===================================================== */

const loginPanel =
  document.getElementById("loginPanel");

const directorPanel =
  document.getElementById("directorPanel");

const supervisorPanel =
  document.getElementById("supervisorPanel");

const requesterPanel =
  document.getElementById("requesterPanel");

const loginButton =
  document.getElementById("loginButton");

const loginMessage =
  document.getElementById("loginMessage");


/* =====================================================
   MESSAGE
   ===================================================== */

function showMessage(element, text, type) {

  element.className =
    "message " + type;

  element.innerText =
    text;

}


/* =====================================================
   LOGIN BY SPECIAL CODE
   ===================================================== */

async function loginByCode() {

  const input =
    document.getElementById("accessCode");

  const code =
    input.value.trim().toUpperCase();


  if (!code) {

    showMessage(
      loginMessage,
      "⚠️ Коди махсусро ворид кунед.",
      "error"
    );

    return;
  }


  loginButton.disabled = true;

  loginButton.innerText =
    "⏳ Санҷида истодааст...";


  showMessage(
    loginMessage,
    "⏳ Код санҷида шуда истодааст...",
    "info"
  );


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .rpc(
          "check_access_code",
          {
            entered_code: code
          }
        );


    if (error) {

      console.error(error);

      showMessage(
        loginMessage,
        "❌ Хатои Supabase: " +
        error.message,
        "error"
      );

      return;
    }


    if (!data || data.length === 0) {

      showMessage(
        loginMessage,
        "⛔ Код нодуруст аст ё ғайрифаъол мебошад.",
        "error"
      );

      return;
    }


    currentStaff =
      data[0];


    localStorage.setItem(
      "tajnet_staff",
      JSON.stringify(currentStaff)
    );


    loginPanel.classList.add("hidden");


    openRolePanel();


  }

  catch (error) {

    console.error(error);

    showMessage(
      loginMessage,
      "❌ Хато: " +
      error.message,
      "error"
    );

  }

  finally {

    loginButton.disabled = false;

    loginButton.innerText =
      "🔑 Ворид шудан";

  }

}


/* =====================================================
   OPEN ROLE PANEL
   ===================================================== */

function openRolePanel() {

  directorPanel.classList.add("hidden");

  supervisorPanel.classList.add("hidden");

  requesterPanel.classList.add("hidden");


  if (!currentStaff) {

    loginPanel.classList.remove("hidden");

    return;
  }


  if (
    currentStaff.role ===
    "director"
  ) {

    document
      .getElementById("directorName")
      .innerText =
      currentStaff.full_name;

    directorPanel.classList.remove("hidden");

    showStores();

  }


  else if (
    currentStaff.role ===
    "supervisor"
  ) {

    document
      .getElementById("supervisorName")
      .innerText =
      currentStaff.full_name;

    supervisorPanel.classList.remove("hidden");

    supervisorStores();

  }


  else if (
    currentStaff.role ===
    "requester"
  ) {

    document
      .getElementById("requesterName")
      .innerText =
      currentStaff.full_name;

    requesterPanel.classList.remove("hidden");

    loadMyRequests();

  }

}


/* =====================================================
   DIRECTOR — STORES
   ===================================================== */

async function showStores() {

  const box =
    document.getElementById(
      "directorContent"
    );

  box.innerHTML =
    "<p>⏳ Мағозаҳо...</p>";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("stores")
      .select(
        "id,name,address,latitude,longitude"
      )
      .order(
        "id",
        {
          ascending: false
        }
      );


  if (error) {

    box.innerHTML =
      "❌ " +
      escapeHtml(
        error.message
      );

    return;
  }


  if (!data.length) {

    box.innerHTML =
      "<p>Ҳоло мағоза нест.</p>";

    return;
  }


  box.innerHTML =
    "<h3>🏪 Рӯйхати мағозаҳо</h3>";


  data.forEach(store => {

    const div =
      document.createElement("div");

    div.className =
      "store";


    div.innerHTML = `

      <b>🏪 ${escapeHtml(store.name)}</b>

      <br><br>

      📍 ${escapeHtml(
        store.address || ""
      )}

      <br><br>

      🌐 ${store.latitude},
      ${store.longitude}

    `;


    box.appendChild(div);

  });

}


/* =====================================================
   DIRECTOR — STAFF
   ===================================================== */

async function showStaff() {

  const box =
    document.getElementById(
      "directorContent"
    );

  box.innerHTML =
    "<p>⏳ Корбарон...</p>";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("staff")
      .select(
        "full_name,role,access_code,active"
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    box.innerHTML =
      "❌ " +
      escapeHtml(
        error.message
      );

    return;
  }


  box.innerHTML =
    "<h3>👥 Корбарон</h3>";


  data.forEach(person => {

    const div =
      document.createElement("div");

    div.className =
      "store";


    div.innerHTML = `

      <b>
        ${roleName(person.role)}
      </b>

      <br><br>

      👤 ${escapeHtml(person.full_name)}

      <br>

      🔑 Код:
      <b>${escapeHtml(person.access_code)}</b>

      <br>

      ${person.active ? "🟢 Фаъол" : "🔴 Ғайрифаъол"}

    `;


    box.appendChild(div);

  });

}


/* =====================================================
   DIRECTOR — REQUESTS
   ===================================================== */

async function showRequests() {

  const box =
    document.getElementById(
      "directorContent"
    );

  box.innerHTML =
    "<p>⏳ Заявкаҳо...</p>";


  const {
    data,
    error
  } =
    await supabaseClient
      .from("requests")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    box.innerHTML =
      "❌ " +
      escapeHtml(
        error.message
      );

    return;
  }


  if (!data.length) {

    box.innerHTML =
      "<p>Ҳоло заявка нест.</p>";

    return;
  }


  box.innerHTML =
    "<h3>📋 Заявкаҳо</h3>";


  data.forEach(request => {

    const div =
      document.createElement("div");

    div.className =
      "request";


    div.innerHTML = `

      <b>
        ${escapeHtml(request.title)}
      </b>

      <br><br>

      ${escapeHtml(
        request.description || ""
      )}

      <br><br>

      📌 Статус:
      <b>${escapeHtml(request.status)}</b>

    `;


    box.appendChild(div);

  });

}


/* =====================================================
   SUPERVISOR — STORES
   ===================================================== */

async function supervisorStores() {

  const box =
    document.getElementById(
      "supervisorContent"
    );

  box.innerHTML =
    "<h3>🏪 Мағозаҳо</h3>" +
    "<p>Рӯйхати мағозаҳо дар ин ҷо нишон дода мешавад.</p>";

}


/* =====================================================
   SUPERVISOR — REQUESTS
   ===================================================== */

async function supervisorRequests() {

  const box =
    document.getElementById(
      "supervisorContent"
    );

  box.innerHTML =
    "<h3>📋 Заявкаҳо</h3>" +
    "<p>Заявкаҳои вобаста ба супервайзер дар ин ҷо нишон дода мешаванд.</p>";

}


/* =====================================================
   REQUESTER — SEND REQUEST
   ===================================================== */

async function sendRequest() {

  const title =
    document
      .getElementById("requestTitle")
      .value
      .trim();


  const description =
    document
      .getElementById("requestDescription")
      .value
      .trim();


  const msg =
    document.getElementById(
      "requestMessage"
    );


  if (!title) {

    showMessage(
      msg,
      "⚠️ Номи заявкаро ворид кунед.",
      "error"
    );

    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("requests")
      .insert({

        requester_name:
          currentStaff.full_name,

        requester_id:
          currentStaff.staff_id,

        title:
          title,

        description:
          description

      });


  if (error) {

    showMessage(
      msg,
      "❌ " + error.message,
      "error"
    );

    return;
  }


  showMessage(
    msg,
    "✅ Заявка фиристода шуд.",
    "success"
  );


  document
    .getElementById("requestTitle")
    .value = "";

  document
    .getElementById("requestDescription")
    .value = "";


  loadMyRequests();

}


/* =====================================================
   REQUESTER — MY REQUESTS
   ===================================================== */

async function loadMyRequests() {

  if (!currentStaff) return;


  const box =
    document.getElementById(
      "myRequests"
    );


  const {
    data,
    error
  } =
    await supabaseClient
      .from("requests")
      .select("*")
      .eq(
        "requester_name",
        currentStaff.full_name
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    box.innerHTML =
      "❌ " +
      escapeHtml(
        error.message
      );

    return;
  }


  box.innerHTML =
    "<h3 style='margin-top:30px;'>📋 Заявкаҳои ман</h3>";


  if (!data.length) {

    box.innerHTML +=
      "<p>Ҳоло заявка надоред.</p>";

    return;
  }


  data.forEach(request => {

    const div =
      document.createElement("div");

    div.className =
      "request";


    div.innerHTML = `

      <b>
        ${escapeHtml(request.title)}
      </b>

      <br><br>

      ${escapeHtml(
        request.description || ""
      )}

      <br><br>

      📌 Статус:
      <b>${escapeHtml(request.status)}</b>

    `;


    box.appendChild(div);

  });

}


/* =====================================================
   ROLE NAME
   ===================================================== */

function roleName(role) {

  if (role === "director")
    return "👨‍💼 Директор";

  if (role === "supervisor")
    return "🧑‍💼 Супервайзер";

  if (role === "requester")
    return "📝 Заявщик";

  return role;

}


/* =====================================================
   LOGOUT
   ===================================================== */

function logout() {

  currentStaff = null;

  localStorage.removeItem(
    "tajnet_staff"
  );


  directorPanel.classList.add("hidden");

  supervisorPanel.classList.add("hidden");

  requesterPanel.classList.add("hidden");

  loginPanel.classList.remove("hidden");


  document
    .getElementById("accessCode")
    .value = "";


  loginMessage.className =
    "message";

  loginMessage.style.display =
    "none";

}


/* =====================================================
   ESCAPE HTML
   ===================================================== */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text == null
      ? ""
      : String(text);

  return div.innerHTML;

}


/* =====================================================
   RESTORE LOGIN
   ===================================================== */

try {

  const saved =
    localStorage.getItem(
      "tajnet_staff"
    );


  if (saved) {

    currentStaff =
      JSON.parse(saved);

    loginPanel.classList.add(
      "hidden"
    );

    openRolePanel();

  }

}
catch (error) {

  localStorage.removeItem(
    "tajnet_staff"
  );

}

</script>

</body>
  </html>
