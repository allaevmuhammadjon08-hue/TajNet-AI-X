<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панели директор</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    .header {
      background: #111827;
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 11px;
      background: #16a34a;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(.98);
    }

    #message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    .store {
      margin-top: 15px;
      padding: 15px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      background: #fafafa;
    }

    .store strong {
      font-size: 18px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="header">
  <h1>👨‍💼 Панели директор</h1>
</div>

<div class="container">

  <div id="loading" class="card">
    Санҷиши иҷозат...
  </div>

  <div id="panel" class="card hidden">

    <h2>➕ Илова кардани мағоза</h2>

    <label>Номи мағоза</label>

    <input
      id="storeName"
      type="text"
      placeholder="Масалан: Мағозаи Хуроквории Ворис"
    >

    <label>Суроға</label>

    <input
      id="storeAddress"
      type="text"
      placeholder="Масалан: 46 мкр, пушти бозор"
    >

    <button onclick="addStore()">
      ➕ Илова кардани мағоза
    </button>

    <div id="message"></div>

    <h2 style="margin-top:30px;">🏪 Мағозаҳо</h2>

    <div id="stores"></div>

  </div>

</div>

<script>

  /* ==============================
     SUPABASE
  ============================== */

  const SUPABASE_URL =
    "https://hyfcgiipstcuobjtnyvz.supabase.co";

  const SUPABASE_ANON_KEY =
    "sb_publishable_C6rL2SmXOXwU8ZzJoX4z0Q_1OvXGPFu";


  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


  /* ==============================
     CHECK DIRECTOR
  ============================== */

  async function checkDirector() {

    const loading =
      document.getElementById("loading");

    const panel =
      document.getElementById("panel");


    const {
      data: { user },
      error
    } = await supabaseClient.auth.getUser();


    if (error || !user) {

      loading.innerHTML =
        "❌ Шумо ба аккаунт ворид нашудаед.";

      return;
    }


    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .single();


    if (
      profileError ||
      !profile ||
      profile.role !== "director"
    ) {

      loading.innerHTML =
        "⛔ Дастрасӣ танҳо барои директор иҷозат аст.";

      return;
    }


    loading.classList.add("hidden");

    panel.classList.remove("hidden");

    loadStores();
  }


  /* ==============================
     ADD STORE
  ============================== */

  async function addStore() {

    const name =
      document.getElementById("storeName")
        .value.trim();


    const address =
      document.getElementById("storeAddress")
        .value.trim();


    const message =
      document.getElementById("message");


    if (!name || !address) {

      message.className = "error";

      message.innerText =
        "⚠️ Номи мағоза ва суроға ҳатмист.";

      return;
    }


    message.className = "";

    message.style.display = "block";

    message.innerText =
      "⏳ Илова шуда истодааст...";


    const {
      data,
      error
    } =
      await supabaseClient
        .from("stores")
        .insert([
          {
            name: name,
            address: address
          }
        ])
        .select();


    if (error) {

      console.error(error);

      message.className = "error";

      message.innerText =
        "❌ Хато: " + error.message;

      return;
    }


    message.className = "success";

    message.innerText =
      "✅ Мағоза бомуваффақият илова шуд!";


    document.getElementById("storeName").value = "";

    document.getElementById("storeAddress").value = "";


    loadStores();
  }


  /* ==============================
     LOAD STORES
  ============================== */

  async function loadStores() {

    const storesBox =
      document.getElementById("stores");


    storesBox.innerHTML =
      "⏳ Бор шуда истодааст...";


    const {
      data,
      error
    } =
      await supabaseClient
        .from("stores")
        .select("*")
        .order("id", {
          ascending: false
        });


    if (error) {

      storesBox.innerHTML =
        "❌ " + error.message;

      return;
    }


    if (!data || data.length === 0) {

      storesBox.innerHTML =
        "Ҳоло ягон мағоза нест.";

      return;
    }


    storesBox.innerHTML = "";


    data.forEach(store => {

      const div =
        document.createElement("div");


      div.className = "store";


      div.innerHTML = `
        <strong>
          🏪 ${escapeHtml(store.name)}
        </strong>

        <br><br>

        📍 ${escapeHtml(
          store.address || "Суроға нест"
        )}
      `;


      storesBox.appendChild(div);

    });
  }


  /* ==============================
     SECURITY
  ============================== */

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }


  /* ==============================
     START
  ============================== */

  checkDirector();

</script>

</body>
      </html>
