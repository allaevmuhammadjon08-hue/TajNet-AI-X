<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Go to Market</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #172c62 0%, transparent 40%),
        linear-gradient(135deg, #071126, #0d1730 55%, #071126);
      color: #fff;
      padding: 25px 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: auto;
    }

    .logo {
      width: 100px;
      height: 100px;
      margin: 35px auto 20px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
      background: linear-gradient(135deg, #00c6ff, #1473ff);
      box-shadow: 0 15px 40px rgba(0, 140, 255, .35);
    }

    h1 {
      text-align: center;
      font-size: 38px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aab5cf;
      font-size: 18px;
      margin-bottom: 35px;
    }

    .card {
      background: rgba(20, 31, 58, .88);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 28px;
      padding: 30px;
      box-shadow: 0 25px 60px rgba(0,0,0,.3);
      backdrop-filter: blur(15px);
    }

    .login-title {
      text-align: center;
      font-size: 28px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      color: #b9c4db;
      font-size: 16px;
      margin: 18px 0 9px;
    }

    input {
      width: 100%;
      height: 58px;
      padding: 0 18px;
      border-radius: 18px;
      border: 1px solid #354463;
      outline: none;
      background: #0a1328;
      color: #fff;
      font-size: 17px;
    }

    input:focus {
      border-color: #159cff;
      box-shadow: 0 0 0 3px rgba(21,156,255,.12);
    }

    button {
      width: 100%;
      height: 60px;
      margin-top: 25px;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(135deg, #08b8ff, #176fff);
      color: white;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0,120,255,.3);
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 20px;
      padding: 15px;
      border-radius: 15px;
      text-align: center;
      font-size: 15px;
    }

    .error {
      display: block;
      background: rgba(255,60,90,.12);
      border: 1px solid rgba(255,60,90,.35);
      color: #ff9aaa;
    }

    .success {
      display: block;
      background: rgba(30,210,130,.12);
      border: 1px solid rgba(30,210,130,.35);
      color: #75e7b0;
    }

    #dashboard {
      display: none;
    }

    .dashboard-card {
      background: rgba(20,31,58,.9);
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 28px;
      padding: 28px;
      box-shadow: 0 25px 60px rgba(0,0,0,.3);
    }

    .role-icon {
      text-align: center;
      font-size: 55px;
      margin-bottom: 10px;
    }

    .dashboard-title {
      text-align: center;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .role-name {
      text-align: center;
      color: #67c7ff;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .info {
      background: #0a1328;
      border: 1px solid #283754;
      border-radius: 16px;
      padding: 16px;
      margin-top: 10px;
    }

    .info span {
      color: #8f9bb5;
      display: block;
      font-size: 13px;
      margin-bottom: 5px;
    }

    .info strong {
      font-size: 17px;
    }

    .logout {
      background: linear-gradient(135deg, #e83b5d, #b91e42);
      box-shadow: none;
    }

    .hidden {
      display: none !important;
    }

    .loading {
      text-align: center;
      color: #aab5cf;
      margin-top: 15px;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 32px;
      }

      .card,
      .dashboard-card {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LOGIN -->
    <section id="loginScreen">

      <div class="logo">🛍️</div>

      <h1>Go to Market</h1>

      <div class="subtitle">
        Системаи идоракунии мағозаҳо
      </div>

      <div class="card">

        <div class="login-title">
          🔐 Воридшавӣ
        </div>

        <form id="loginForm">

          <label for="login">
            Login
          </label>

          <input
            id="login"
            type="text"
            autocomplete="username"
            placeholder="Login ё Email"
            required
          >

          <label for="password">
            Парол
          </label>

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Парол"
            required
          >

          <button id="loginButton" type="submit">
            🔑 Ворид шудан
          </button>

          <div id="message" class="message"></div>

        </form>

      </div>

    </section>


    <!-- DASHBOARD -->
    <section id="dashboard">

      <div class="logo">🛍️</div>

      <div class="dashboard-card">

        <div class="role-icon" id="roleIcon">
          👤
        </div>

        <div class="dashboard-title">
          Go to Market
        </div>

        <div class="role-name" id="roleName">
          -
        </div>

        <div class="info">
          <span>Login</span>
          <strong id="userLogin">-</strong>
        </div>

        <div class="info">
          <span>Email</span>
          <strong id="userEmail">-</strong>
        </div>

        <div class="info">
          <span>Навъи аккаунт</span>
          <strong id="accountType">-</strong>
        </div>

        <div class="info" id="sectorBox">
          <span>Сектор</span>
          <strong id="sectorId">-</strong>
        </div>

        <div class="info" id="regionBox">
          <span>Регион</span>
          <strong id="regionId">-</strong>
        </div>

        <button id="logoutButton" class="logout">
          🚪 Баромадан
        </button>

      </div>

    </section>

  </div>


<script>

  /* =========================================================
     SUPABASE
     ========================================================= */

  const SUPABASE_URL =
    "https://hyfcgiipstcuobjtnyvz.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_C6rL2SmXOXwU8ZzJoX4z0Q_1OvXGPFu";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================================
     LOGIN ALIASES
     ========================================================= */

  const LOGIN_EMAILS = {

    "director":
      "director@gotomarket.local",

    "sup.1":
      "sup1@gotomarket.local",

    "sup.2":
      "sup2@gotomarket.local",

    "sect.1":
      "sect1@gotomarket.local",

    "sect.2":
      "sect2@gotomarket.local",

    "sect.3":
      "sect3@gotomarket.local",

    "sect.4":
      "sect4@gotomarket.local",

    "sect.5":
      "sect5@gotomarket.local",

    "sect.6":
      "sect6@gotomarket.local",

    "reg.1":
      "reg1@gotomarket.local",

    "reg.2":
      "reg2@gotomarket.local",

    "reg.3":
      "reg3@gotomarket.local",

    "reg.4":
      "reg4@gotomarket.local",

    "reg.5":
      "reg5@gotomarket.local",

    "reg.6":
      "reg6@gotomarket.local"
  };


  /* =========================================================
     ELEMENTS
     ========================================================= */

  const loginScreen =
    document.getElementById("loginScreen");

  const dashboard =
    document.getElementById("dashboard");

  const loginForm =
    document.getElementById("loginForm");

  const loginInput =
    document.getElementById("login");

  const passwordInput =
    document.getElementById("password");

  const loginButton =
    document.getElementById("loginButton");

  const message =
    document.getElementById("message");

  const logoutButton =
    document.getElementById("logoutButton");


  /* =========================================================
     MESSAGE
     ========================================================= */

  function showMessage(text, type = "error") {

    message.textContent = text;

    message.className =
      "message " + type;
  }


  function hideMessage() {

    message.textContent = "";

    message.className =
      "message";
  }


  /* =========================================================
     LOGIN NAME → EMAIL
     ========================================================= */

  function convertLoginToEmail(value) {

    const clean =
      value.trim().toLowerCase();

    if (clean.includes("@")) {
      return clean;
    }

    if (LOGIN_EMAILS[clean]) {
      return LOGIN_EMAILS[clean];
    }

    return clean;
  }


  /* =========================================================
     ROLE TEXT
     ========================================================= */

  function getRoleText(role, accountType) {

    if (role === "director") {
      return "Director";
    }

    if (role === "supervisor") {
      return "Supervisor";
    }

    if (role === "zayavshik" && accountType === "sector") {
      return "Sector";
    }

    if (role === "zayavshik" && accountType === "region") {
      return "Region";
    }

    return role || accountType || "User";
  }


  function getRoleIcon(role, accountType) {

    if (role === "director") {
      return "👑";
    }

    if (role === "supervisor") {
      return "🛡️";
    }

    if (
      role === "zayavshik" &&
      accountType === "sector"
    ) {
      return "🏢";
    }

    if (
      role === "zayavshik" &&
      accountType === "region"
    ) {
      return "🌍";
    }

    return "👤";
  }


  /* =========================================================
     SHOW DASHBOARD
     ========================================================= */

  function showDashboard(account, email) {

    loginScreen.style.display = "none";

    dashboard.style.display = "block";

    const role =
      account?.role || "";

    const accountType =
      account?.account_type || "";

    document.getElementById("roleIcon")
      .textContent =
      getRoleIcon(role, accountType);

    document.getElementById("roleName")
      .textContent =
      getRoleText(role, accountType);

    document.getElementById("userEmail")
      .textContent =
      email || "-";

    document.getElementById("userLogin")
      .textContent =
      account?.login || email || "-";

    document.getElementById("accountType")
      .textContent =
      accountType || "-";


    /* SECTOR */

    const sectorBox =
      document.getElementById("sectorBox");

    const sectorId =
      document.getElementById("sectorId");

    if (
      accountType === "sector" &&
      account?.sector_id !== null &&
      account?.sector_id !== undefined
    ) {

      sectorBox.classList.remove("hidden");

      sectorId.textContent =
        "Сектор " + account.sector_id;

    } else {

      sectorBox.classList.add("hidden");

    }


    /* REGION */

    const regionBox =
      document.getElementById("regionBox");

    const regionId =
      document.getElementById("regionId");

    if (
      accountType === "region" &&
      account?.region_id !== null &&
      account?.region_id !== undefined
    ) {

      regionBox.classList.remove("hidden");

      regionId.textContent =
        "Регион " + account.region_id;

    } else {

      regionBox.classList.add("hidden");

    }

  }


  /* =========================================================
     LOGIN
     ========================================================= */

  loginForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      hideMessage();

      const enteredLogin =
        loginInput.value.trim();

      const password =
        passwordInput.value;

      if (!enteredLogin || !password) {

        showMessage(
          "Login ва паролро пур кунед."
        );

        return;
      }


      const email =
        convertLoginToEmail(enteredLogin);


      loginButton.disabled = true;

      loginButton.textContent =
        "⏳ Ворид шуда истодааст...";


      try {

        /*
         * SUPABASE AUTH
         */

        const {
          data: authData,
          error: authError
        } =
          await supabaseClient.auth
            .signInWithPassword({
              email: email,
              password: password
            });


        if (authError) {

          console.error(
            "AUTH ERROR:",
            authError
          );

          showMessage(
            "Login ё парол нодуруст аст."
          );

          return;
        }


        if (!authData?.user) {

          showMessage(
            "Корбар пайдо нашуд."
          );

          return;
        }


        /*
         * GET ACCOUNT
         */

        const {
          data: account,
          error: accountError
        } =
          await supabaseClient
            .from("login_accounts")
            .select(
              "id, login, email, role, account_type, sector_id, region_id"
            )
            .eq("email", email)
            .maybeSingle();


        if (accountError) {

          console.error(
            "ACCOUNT ERROR:",
            accountError
          );

          /*
           * Auth successful, but account table
           * may have RLS enabled.
           */

          await supabaseClient.auth.signOut();

          showMessage(
            "Воридшавӣ иҷро шуд, аммо маълумоти аккаунт дастрас нест."
          );

          return;
        }


        if (!account) {

          await supabaseClient.auth.signOut();

          showMessage(
            "Ин аккаунт дар login_accounts вуҷуд надорад."
          );

          return;
        }


        /*
         * CHECK ROLE
         */

        const allowedRoles = [
          "director",
          "supervisor",
          "zayavshik"
        ];

        if (
          !allowedRoles.includes(
            String(account.role).toLowerCase()
          )
        ) {

          await supabaseClient.auth.signOut();

          showMessage(
            "Нақши ин аккаунт нодуруст аст."
          );

          return;
        }


        /*
         * SHOW USER
         */

        showDashboard(
          account,
          authData.user.email
        );


      } catch (error) {

        console.error(
          "LOGIN ERROR:",
          error
        );

        showMessage(
          "Хатои система. Баъдтар кӯшиш кунед."
        );

      } finally {

        loginButton.disabled = false;

        loginButton.textContent =
          "🔑 Ворид шудан";

      }

    }
  );


  /* =========================================================
     LOGOUT
     ========================================================= */

  logoutButton.addEventListener(
    "click",
    async function() {

      await supabaseClient.auth.signOut();

      dashboard.style.display =
        "none";

      loginScreen.style.display =
        "block";

      loginInput.value = "";

      passwordInput.value = "";

      hideMessage();

    }
  );


  /* =========================================================
     CHECK EXISTING SESSION
     ========================================================= */

  async function checkSession() {

    try {

      const {
        data
      } =
        await supabaseClient.auth
          .getSession();

      const session =
        data?.session;

      if (!session?.user) {
        return;
      }


      const email =
        session.user.email;


      const {
        data: account
      } =
        await supabaseClient
          .from("login_accounts")
          .select(
            "id, login, email, role, account_type, sector_id, region_id"
          )
          .eq("email", email)
          .maybeSingle();


      if (account) {

        showDashboard(
          account,
          email
        );

      }

    } catch (error) {

      console.error(
        "SESSION ERROR:",
        error
      );

    }

  }


  /* =========================================================
     START
     ========================================================= */

  checkSession();

</script>

</body>
</html>
