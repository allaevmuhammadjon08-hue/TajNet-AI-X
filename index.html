<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панели директор</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    .header {
      background: #111827;
      color: white;
      padding: 22px 18px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 24px;
    }

    .container {
      max-width: 600px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: 0;
      border-radius: 11px;
      background: #16a34a;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .logout {
      background: #dc2626;
    }

    #message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    .store {
      margin-top: 15px;
      padding: 15px;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="header">
  <h1>👨‍💼 Панели директор</h1>
</div>

<div class="container">

  <!-- LOGIN -->
  <div id="loginBox" class="card">
    <h2>🔐 Воридшавӣ</h2>

    <label>Email</label>
    <input id="email" type="email" placeholder="Email-и шумо">

    <label>Парол</label>
    <input id="password" type="password" placeholder="Парол">

    <button onclick="login()">
      🔑 Ворид шудан
    </button>

    <div id="loginMessage"></div>
  </div>


  <!-- DIRECTOR PANEL -->
  <div id="panel" class="card hidden">

    <h2>➕ Илова кардани мағоза</h2>

    <label>Номи мағоза</label>
    <input
      id="storeName"
      type="text"
      placeholder="Масалан: Мағозаи Хуроквории Ворис"
    >

    <label>Суроға</label>
    <input
      id="storeAddress"
      type="text"
      placeholder="Масалан: 46 мкр, пушти бозор"
    >

    <button onclick="addStore()">
      ➕ Илова кардани мағоза
    </button>

    <div id="message"></div>

    <h2 style="margin-top:30px;">🏪 Мағозаҳо</h2>

    <div id="stores"></div>

    <button class="logout" onclick="logout()">
      🚪 Баромадан
    </button>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://hyfcgiipstcuobjtnyvz.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_C6rL2SmXOXwU8ZzJoX4z0Q_1OvXGPFu";


const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


// LOGIN
async function login() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const msg =
    document.getElementById("loginMessage");

  if (!email || !password) {

    msg.className = "error";
    msg.innerText =
      "⚠️ Email ва паролро ворид кунед.";

    return;
  }

  msg.className = "";
  msg.style.display = "block";
  msg.innerText = "⏳ Ворид шуда истодааст...";


  const { data, error } =
    await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password
    });


  if (error) {

    msg.className = "error";
    msg.innerText =
      "❌ " + error.message;

    return;
  }


  msg.className = "success";
  msg.innerText =
    "✅ Ворид шудед.";

  checkDirector();
}


// CHECK DIRECTOR
async function checkDirector() {

  const {
    data: { user }
  } = await supabaseClient.auth.getUser();


  if (!user) {
    return;
  }


  const { data: profile, error } =
    await supabaseClient
      .from("profiles")
      .select("role")
      .eq("id", user.id)
      .single();


  if (error || !profile) {

    document.getElementById("loginMessage").className = "error";

    document.getElementById("loginMessage").innerText =
      "⛔ Барои ин аккаунт профили director сохта нашудааст.";

    return;
  }


  if (profile.role !== "director") {

    document.getElementById("loginMessage").className = "error";

    document.getElementById("loginMessage").innerText =
      "⛔ Ин аккаунт директор нест.";

    await supabaseClient.auth.signOut();

    return;
  }


  document.getElementById("loginBox")
    .classList.add("hidden");

  document.getElementById("panel")
    .classList.remove("hidden");

  loadStores();
}


// ADD STORE
async function addStore() {

  const name =
    document.getElementById("storeName").value.trim();

  const address =
    document.getElementById("storeAddress").value.trim();

  const message =
    document.getElementById("message");


  if (!name || !address) {

    message.className = "error";

    message.innerText =
      "⚠️ Номи мағоза ва суроға ҳатмист.";

    return;
  }


  message.className = "";

  message.style.display = "block";

  message.innerText =
    "⏳ Илова шуда истодааст...";


  const { error } =
    await supabaseClient
      .from("stores")
      .insert([
        {
          name: name,
          address: address
        }
      ]);


  if (error) {

    message.className = "error";

    message.innerText =
      "❌ Хато: " + error.message;

    return;
  }


  message.className = "success";

  message.innerText =
    "✅ Мағоза бомуваффақият илова шуд!";


  document.getElementById("storeName").value = "";

  document.getElementById("storeAddress").value = "";


  loadStores();
}


// LOAD STORES
async function loadStores() {

  const storesBox =
    document.getElementById("stores");

  storesBox.innerHTML =
    "⏳ Бор шуда истодааст...";


  const { data, error } =
    await supabaseClient
      .from("stores")
      .select("*")
      .order("id", { ascending: false });


  if (error) {

    storesBox.innerHTML =
      "❌ " + error.message;

    return;
  }


  if (!data || data.length === 0) {

    storesBox.innerHTML =
      "Ҳоло ягон мағоза нест.";

    return;
  }


  storesBox.innerHTML = "";


  data.forEach(store => {

    const div =
      document.createElement("div");

    div.className = "store";

    div.innerHTML = `
      <strong>🏪 ${escapeHtml(store.name)}</strong>
      <br><br>
      📍 ${escapeHtml(store.address || "Суроға нест")}
    `;

    storesBox.appendChild(div);

  });
}


// ESCAPE HTML
function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


// LOGOUT
async function logout() {

  await supabaseClient.auth.signOut();

  location.reload();
}


// CHECK SESSION
checkDirector();

</script>

</body>
  </html>
