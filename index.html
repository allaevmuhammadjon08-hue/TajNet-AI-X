<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Панели директор</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
    }

    .header {
      background: #111827;
      color: white;
      padding: 22px 15px;
      text-align: center;
    }

    .header h1 {
      margin: 0;
      font-size: 25px;
    }

    .container {
      max-width: 650px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .hidden {
      display: none !important;
    }

    h2 {
      margin-top: 0;
      font-size: 25px;
    }

    label {
      display: block;
      margin-top: 17px;
      margin-bottom: 8px;
      font-weight: bold;
      font-size: 17px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #d1d5db;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 16px;
      border: 0;
      border-radius: 12px;
      background: #16a34a;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .logout {
      background: #dc2626;
      margin-top: 25px;
    }

    #message {
      margin-top: 15px;
      padding: 14px;
      border-radius: 12px;
      display: none;
      line-height: 1.5;
    }

    .success {
      display: block !important;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block !important;
      background: #fee2e2;
      color: #991b1b;
    }

    .info {
      display: block !important;
      background: #dbeafe;
      color: #1e40af;
    }

    .location-box {
      margin-top: 18px;
      padding: 15px;
      border-radius: 12px;
      background: #f3f4f6;
      font-size: 15px;
      line-height: 1.7;
    }

    .store {
      margin-top: 15px;
      padding: 17px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      background: #fff;
    }

    .store strong {
      font-size: 18px;
    }

    .coords {
      margin-top: 8px;
      color: #6b7280;
      font-size: 13px;
    }

    .loading {
      text-align: center;
      padding: 15px;
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>👨‍💼 Панели директор</h1>
  </div>

  <div class="container">

    <!-- Санҷиши аккаунт -->
    <div id="loading" class="card loading">
      ⏳ Санҷиши аккаунт...
    </div>

    <!-- Панели асосӣ -->
    <div id="panel" class="card hidden">

      <h2>➕ Илова кардани мағоза</h2>

      <label for="storeName">Номи мағоза</label>

      <input
        id="storeName"
        type="text"
        placeholder="Масалан: Мағозаи хуроквории Сафар"
      >

      <label for="storeAddress">Суроға</label>

      <input
        id="storeAddress"
        type="text"
        placeholder="Масалан: 46 мкр, пушти Содот"
      >

      <div class="location-box">
        📍 <b>Ҷойгиршавӣ:</b>
        <br>
        GPS ҳангоми илова кардани мағоза гирифта мешавад.
        <br>
        Latitude ва Longitude ба таври автоматӣ ба Supabase фиристода мешаванд.
      </div>

      <button id="addButton" onclick="addStore()">
        📍 Илова кардан бо Location
      </button>

      <div id="message"></div>

      <h2 style="margin-top:30px;">
        🏪 Мағозаҳо
      </h2>

      <div id="stores">
        ⏳ Бор шуда истодааст...
      </div>

      <button class="logout" onclick="logout()">
        🚪 Баромадан
      </button>

    </div>

  </div>


<script>

/* =========================================================
   SUPABASE
   ========================================================= */

const SUPABASE_URL =
  "https://hyfcgiipstcuobjtnyvz.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_C6rL2SmXOXwU8ZzJoX4z0Q_1OvXGPFu";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =========================================================
   ELEMENTS
   ========================================================= */

const loading =
  document.getElementById("loading");

const panel =
  document.getElementById("panel");

const message =
  document.getElementById("message");

const addButton =
  document.getElementById("addButton");

const storesBox =
  document.getElementById("stores");


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text, type) {

  message.className = "";

  message.classList.add(type);

  message.innerText = text;

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text == null ? "" : String(text);

  return div.innerHTML;
}


/* =========================================================
   GET GPS LOCATION
   ========================================================= */

function getLocation() {

  return new Promise((resolve, reject) => {

    if (!navigator.geolocation) {

      reject(
        new Error(
          "GPS дар браузери шумо дастгирӣ намешавад."
        )
      );

      return;
    }


    navigator.geolocation.getCurrentPosition(

      function(position) {

        const latitude =
          position.coords.latitude;

        const longitude =
          position.coords.longitude;


        if (
          latitude === null ||
          longitude === null ||
          !Number.isFinite(latitude) ||
          !Number.isFinite(longitude)
        ) {

          reject(
            new Error(
              "GPS координатаи дуруст надод."
            )
          );

          return;
        }


        resolve({
          latitude: latitude,
          longitude: longitude,
          accuracy: position.coords.accuracy
        });

      },

      function(error) {

        let text =
          "GPS гирифта нашуд.";

        if (error.code === 1) {

          text =
            "❌ Иҷозаи Location дода нашудааст. Location-и браузерро иҷозат диҳед.";

        }

        else if (error.code === 2) {

          text =
            "❌ Location дастрас нест. GPS-и телефонро фаъол кунед.";

        }

        else if (error.code === 3) {

          text =
            "❌ GPS ҷавоб надод. Бори дигар кӯшиш кунед.";

        }

        reject(
          new Error(text)
        );

      },

      {
        enableHighAccuracy: true,
        timeout: 20000,
        maximumAge: 0
      }

    );

  });

}


/* =========================================================
   CHECK DIRECTOR
   ========================================================= */

async function checkDirector() {

  try {

    const {
      data: { user },
      error
    } =
      await supabaseClient.auth.getUser();


    if (error || !user) {

      loading.innerHTML =
        "❌ Шумо ба аккаунт ворид нашудаед.";

      return;
    }


    const {
      data: profile,
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .select("role")
        .eq("id", user.id)
        .maybeSingle();


    if (profileError) {

      console.error(profileError);

      loading.innerHTML =
        "❌ Хато ҳангоми санҷиши профил:<br>" +
        escapeHtml(profileError.message);

      return;
    }


    if (!profile) {

      loading.innerHTML =
        "⛔ Барои ин аккаунт профил ёфт нашуд.";

      return;
    }


    if (profile.role !== "director") {

      loading.innerHTML =
        "⛔ Ин аккаунт директор нест.";

      return;
    }


    loading.classList.add("hidden");

    panel.classList.remove("hidden");

    loadStores();

  }

  catch (error) {

    console.error(error);

    loading.innerHTML =
      "❌ Хато:<br>" +
      escapeHtml(error.message);

  }

}


/* =========================================================
   ADD STORE
   ========================================================= */

async function addStore() {

  const name =
    document
      .getElementById("storeName")
      .value
      .trim();

  const address =
    document
      .getElementById("storeAddress")
      .value
      .trim();


  if (!name) {

    showMessage(
      "⚠️ Номи мағоза ҳатмист.",
      "error"
    );

    return;
  }


  if (!address) {

    showMessage(
      "⚠️ Суроға ҳатмист.",
      "error"
    );

    return;
  }


  addButton.disabled = true;

  addButton.innerText =
    "📍 Ҷойгиршавӣ гирифта шуда истодааст...";


  showMessage(
    "⏳ GPS-и телефонро муайян карда истодаем. Лутфан иҷозаи Location диҳед...",
    "info"
  );


  try {

    /* -----------------------------------------
       1. GET GPS
       ----------------------------------------- */

    const location =
      await getLocation();


    const latitude =
      Number(location.latitude);

    const longitude =
      Number(location.longitude);


    /* -----------------------------------------
       2. FINAL VALIDATION
       ----------------------------------------- */

    if (
      !Number.isFinite(latitude) ||
      !Number.isFinite(longitude)
    ) {

      throw new Error(
        "Latitude ё Longitude нодуруст аст."
      );

    }


    /* -----------------------------------------
       3. INSERT SUPABASE
       ----------------------------------------- */

    addButton.innerText =
      "⏳ Сабт шуда истодааст...";


    const {
      data,
      error
    } =
      await supabaseClient
        .from("stores")
        .insert({

          name: name,

          address: address,

          latitude: latitude,

          longitude: longitude

        })
        .select();


    /* -----------------------------------------
       4. CHECK INSERT ERROR
       ----------------------------------------- */

    if (error) {

      console.error(
        "SUPABASE INSERT ERROR:",
        error
      );

      throw new Error(
        error.message
      );

    }


    /* -----------------------------------------
       5. SUCCESS
       ----------------------------------------- */

    showMessage(
      "✅ Мағоза бомуваффақият илова шуд!\n" +
      "📍 Latitude: " +
      latitude.toFixed(6) +
      "\n📍 Longitude: " +
      longitude.toFixed(6),
      "success"
    );


    document
      .getElementById("storeName")
      .value = "";

    document
      .getElementById("storeAddress")
      .value = "";


    await loadStores();

  }

  catch (error) {

    console.error(
      "ADD STORE ERROR:",
      error
    );

    showMessage(
      "❌ Хато:\n" +
      error.message,
      "error"
    );

  }

  finally {

    addButton.disabled = false;

    addButton.innerText =
      "📍 Илова кардан бо Location";

  }

}


/* =========================================================
   LOAD STORES
   ========================================================= */

async function loadStores() {

  storesBox.innerHTML =
    "⏳ Мағозаҳо бор шуда истодаанд...";


  try {

    const {
      data,
      error
    } =
      await supabaseClient
        .from("stores")
        .select(
          "id,name,address,latitude,longitude"
        )
        .order(
          "id",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(error);

      storesBox.innerHTML =
        "❌ Хато: " +
        escapeHtml(error.message);

      return;
    }


    if (!data || data.length === 0) {

      storesBox.innerHTML =
        "Ҳоло ягон мағоза нест.";

      return;
    }


    storesBox.innerHTML = "";


    data.forEach(store => {

      const div =
        document.createElement("div");

      div.className =
        "store";


      const lat =
        Number(store.latitude);

      const lng =
        Number(store.longitude);


      let coordinates =
        "📍 Координата нест";


      if (
        Number.isFinite(lat) &&
        Number.isFinite(lng)
      ) {

        coordinates =
          "📍 Latitude: " +
          lat.toFixed(6) +
          "<br>" +
          "📍 Longitude: " +
          lng.toFixed(6);

      }


      div.innerHTML = `

        <strong>
          🏪 ${escapeHtml(store.name)}
        </strong>

        <br><br>

        📍 ${escapeHtml(
          store.address || "Суроға нест"
        )}

        <div class="coords">
          ${coordinates}
        </div>

      `;


      storesBox.appendChild(div);

    });

  }

  catch (error) {

    console.error(error);

    storesBox.innerHTML =
      "❌ Хато ҳангоми боркунии мағозаҳо.";

  }

}


/* =========================================================
   LOGOUT
   ========================================================= */

async function logout() {

  const {
    error
  } =
    await supabaseClient.auth.signOut();


  if (error) {

    showMessage(
      "❌ Баромадан нашуд: " +
      error.message,
      "error"
    );

    return;
  }


  window.location.reload();

}


/* =========================================================
   START
   ========================================================= */

checkDirector();

</script>

</body>
        </html>
