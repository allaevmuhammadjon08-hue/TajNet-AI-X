<!DOCTYPE html>
<html lang="tg">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Go to Market</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #273c75 0%, transparent 35%),
        radial-gradient(circle at bottom right, #192a56 0%, transparent 40%),
        linear-gradient(135deg, #080d1c, #101a35);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 14px;
      border-radius: 22px;
      background: linear-gradient(135deg, #00d4ff, #0066ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      box-shadow: 0 15px 40px rgba(0, 140, 255, .35);
    }

    .brand h1 {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -.5px;
    }

    .brand p {
      margin-top: 7px;
      color: #9da9c5;
      font-size: 14px;
    }

    .card {
      background: rgba(20, 29, 52, .88);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 25px 70px rgba(0,0,0,.4);
      backdrop-filter: blur(18px);
    }

    .login-title {
      text-align: center;
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: #b8c2d9;
      font-size: 13px;
    }

    .field input {
      width: 100%;
      height: 52px;
      border: 1px solid #34415f;
      background: #0d1529;
      color: white;
      border-radius: 14px;
      padding: 0 15px;
      outline: none;
      font-size: 16px;
      transition: .2s;
    }

    .field input:focus {
      border-color: #1597ff;
      box-shadow: 0 0 0 3px rgba(21,151,255,.12);
    }

    .login-btn {
      width: 100%;
      height: 54px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(135deg, #00a8ff, #0066ff);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0,120,255,.25);
      transition: .2s;
    }

    .login-btn:active {
      transform: scale(.98);
    }

    .login-btn:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.4;
    }

    .error {
      display: block;
      background: rgba(255, 71, 87, .12);
      border: 1px solid rgba(255, 71, 87, .25);
      color: #ff8d98;
    }

    .success {
      display: block;
      background: rgba(46, 213, 115, .12);
      border: 1px solid rgba(46, 213, 115, .25);
      color: #72e7a1;
    }

    /* DASHBOARD */

    #dashboard {
      display: none;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .topbar-left h2 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    .topbar-left p {
      color: #9da9c5;
      font-size: 13px;
    }

    .logout {
      border: 1px solid #3a4764;
      background: #111a2e;
      color: #fff;
      padding: 10px 13px;
      border-radius: 11px;
      cursor: pointer;
    }

    .role-box {
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 15px;
      background: linear-gradient(
        135deg,
        rgba(0,168,255,.17),
        rgba(0,102,255,.06)
      );
      border: 1px solid rgba(0,168,255,.2);
    }

    .role-label {
      color: #8fa0c0;
      font-size: 12px;
      margin-bottom: 6px;
    }

    .role-name {
      font-size: 24px;
      font-weight: 800;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .info {
      background: #0d1529;
      border: 1px solid #25314c;
      border-radius: 15px;
      padding: 15px;
    }

    .info small {
      color: #8996b2;
      display: block;
      margin-bottom: 6px;
    }

    .info strong {
      font-size: 16px;
    }

    .section {
      margin-top: 15px;
      padding: 18px;
      border-radius: 18px;
      background: rgba(13,21,41,.9);
      border: 1px solid #25314c;
    }

    .section h3 {
      margin-bottom: 8px;
      font-size: 17px;
    }

    .section p {
      color: #9da9c5;
      font-size: 13px;
      line-height: 1.5;
    }

    .loading {
      text-align: center;
      padding: 15px;
      color: #aab6cf;
      font-size: 14px;
    }

    @media (max-width: 380px) {
      .card {
        padding: 20px;
      }

      .brand h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- BRAND -->
    <div class="brand">
      <div class="brand-icon">🛍️</div>
      <h1>Go to Market</h1>
      <p>Системаи идоракунии мағозаҳо</p>
    </div>


    <!-- LOGIN -->
    <div id="loginPage" class="card">

      <div class="login-title">
        🔐 Воридшавӣ
      </div>

      <form id="loginForm">

        <div class="field">
          <label for="login">Login</label>

          <input
            id="login"
            type="text"
            autocomplete="username"
            placeholder="Login-и худро ворид кунед"
            required
          >
        </div>

        <div class="field">
          <label for="password">Парол</label>

          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="Парол"
            required
          >
        </div>

        <button
          id="loginButton"
          class="login-btn"
          type="submit"
        >
          🔑 Ворид шудан
        </button>

        <div id="loginMessage" class="message"></div>

      </form>
    </div>


    <!-- DASHBOARD -->
    <div id="dashboard" class="card">

      <div class="topbar">

        <div class="topbar-left">
          <h2>Go to Market</h2>
          <p id="welcomeText">Хуш омадед</p>
        </div>

        <button id="logoutButton" class="logout">
          Баромадан
        </button>

      </div>


      <div class="role-box">

        <div class="role-label">
          Навъи аккаунт
        </div>

        <div id="roleName" class="role-name">
          —
        </div>

      </div>


      <div class="info-grid">

        <div class="info">
          <small>Login</small>
          <strong id="userLogin">—</strong>
        </div>

        <div class="info">
          <small>Нақш</small>
          <strong id="userRole">—</strong>
        </div>

        <div class="info">
          <small>Сектор</small>
          <strong id="userSector">—</strong>
        </div>

        <div class="info">
          <small>Регион</small>
          <strong id="userRegion">—</strong>
        </div>

      </div>


      <div id="dashboardContent" class="section">
        <h3>📍 Панели корбар</h3>
        <p>
          Маълумоти аккаунти шумо бор шуда истодааст...
        </p>
      </div>

    </div>

  </div>


<script>
/* =========================================================
   GO TO MARKET
   SUPABASE CONFIG
   ========================================================= */

const SUPABASE_URL =
  "https://hyfcgiipstcuobjtnyvz.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_C6rL2SmXOXwU8ZzJoX4z0Q_1OvXGPFu";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   LOGIN -> EMAIL MAP
   Email дар экран нишон дода намешавад.
   ========================================================= */

const LOGIN_EMAILS = {

  "director":
    "director@gotomarket.local",

  "sup.1":
    "sup1@gotomarket.local",

  "sup.2":
    "sup2@gotomarket.local",

  "sect.1":
    "sect1@gotomarket.local",

  "sect.2":
    "sect2@gotomarket.local",

  "sect.3":
    "sect3@gotomarket.local",

  "sect.4":
    "sect4@gotomarket.local",

  "sect.5":
    "sect5@gotomarket.local",

  "sect.6":
    "sect6@gotomarket.local",

  "reg.1":
    "reg1@gotomarket.local",

  "reg.2":
    "reg2@gotomarket.local",

  "reg.3":
    "reg3@gotomarket.local",

  "reg.4":
    "reg4@gotomarket.local",

  "reg.5":
    "reg5@gotomarket.local",

  "reg.6":
    "reg6@gotomarket.local"
};


/* =========================================================
   ELEMENTS
   ========================================================= */

const loginPage =
  document.getElementById("loginPage");

const dashboard =
  document.getElementById("dashboard");

const loginForm =
  document.getElementById("loginForm");

const loginInput =
  document.getElementById("login");

const passwordInput =
  document.getElementById("password");

const loginButton =
  document.getElementById("loginButton");

const loginMessage =
  document.getElementById("loginMessage");

const logoutButton =
  document.getElementById("logoutButton");


/* =========================================================
   NORMALIZE LOGIN
   ========================================================= */

function normalizeLogin(value) {

  return value
    .trim()
    .toLowerCase()
    .replace(/\s+/g, "")
    .replace("sup1", "sup.1")
    .replace("sup2", "sup.2")
    .replace("sect1", "sect.1")
    .replace("sect2", "sect.2")
    .replace("sect3", "sect.3")
    .replace("sect4", "sect.4")
    .replace("sect5", "sect.5")
    .replace("sect6", "sect.6")
    .replace("reg1", "reg.1")
    .replace("reg2", "reg.2")
    .replace("reg3", "reg.3")
    .replace("reg4", "reg.4")
    .replace("reg5", "reg.5")
    .replace("reg6", "reg.6");
}


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text, type = "error") {

  loginMessage.textContent = text;

  loginMessage.className =
    "message " + type;
}


function clearMessage() {

  loginMessage.textContent = "";

  loginMessage.className =
    "message";
}


/* =========================================================
   ROLE LABEL
   ========================================================= */

function roleLabel(role, accountType) {

  const r = String(role || "").toLowerCase();
  const a = String(accountType || "").toLowerCase();

  if (r === "director" || a === "director") {
    return "Director";
  }

  if (r === "supervisor" || a === "supervisor") {
    return "Supervisor";
  }

  if (
    r === "zayavshik" &&
    a === "sector"
  ) {
    return "Sector";
  }

  if (
    r === "zayavshik" &&
    a === "region"
  ) {
    return "Region";
  }

  if (a === "sector") {
    return "Sector";
  }

  if (a === "region") {
    return "Region";
  }

  return "User";
}


/* =========================================================
   GET SECTOR
   ========================================================= */

async function getSectorName(sectorId) {

  if (!sectorId) {
    return "—";
  }

  const { data, error } =
    await supabaseClient
      .from("sectors")
      .select("name, code")
      .eq("id", sectorId)
      .maybeSingle();

  if (error || !data) {
    return "Сектор " + sectorId;
  }

  return data.name || data.code || ("Сектор " + sectorId);
}


/* =========================================================
   GET REGION
   ========================================================= */

async function getRegionName(regionId) {

  if (!regionId) {
    return "—";
  }

  const { data, error } =
    await supabaseClient
      .from("regions")
      .select("name, code")
      .eq("id", regionId)
      .maybeSingle();

  if (error || !data) {
    return "Регион " + regionId;
  }

  return data.name || data.code || ("Регион " + regionId);
}


/* =========================================================
   SHOW DASHBOARD
   ========================================================= */

async function showDashboard(login, account) {

  loginPage.style.display = "none";
  dashboard.style.display = "block";

  const role = roleLabel(
    account?.role,
    account?.account_type
  );

  document.getElementById("roleName")
    .textContent = role;

  document.getElementById("userLogin")
    .textContent = login;

  document.getElementById("userRole")
    .textContent =
      account?.role || "—";

  document.getElementById("userSector")
    .textContent = "—";

  document.getElementById("userRegion")
    .textContent = "—";


  if (account?.sector_id) {

    const sector =
      await getSectorName(
        account.sector_id
      );

    document.getElementById("userSector")
      .textContent = sector;
  }


  if (account?.region_id) {

    const region =
      await getRegionName(
        account.region_id
      );

    document.getElementById("userRegion")
      .textContent = region;
  }


  const content =
    document.getElementById(
      "dashboardContent"
    );


  if (role === "Director") {

    content.innerHTML = `
      <h3>👑 Панели Director</h3>
      <p>
        Шумо ба панели Director ворид шудед.
        Аз ин ҷо назорати умумии система,
        коргарон, секторҳо, регионҳо,
        мағозаҳо ва ҳаракати коргарон идора карда мешавад.
      </p>
    `;

  } else if (role === "Supervisor") {

    content.innerHTML = `
      <h3>🧑‍💼 Панели Supervisor</h3>
      <p>
        Шумо ба панели Supervisor ворид шудед.
        Маълумоти коргарони вобаста ба шумо
        дар ин ҷо идора карда мешавад.
      </p>
    `;

  } else if (role === "Sector") {

    content.innerHTML = `
      <h3>📍 Панели Sector</h3>
      <p>
        Шумо ҳамчун коргари Sector ворид шудед.
        Мағозаҳо ва нуқтаҳои вобаста ба
        сектори шумо нишон дода мешаванд.
      </p>
    `;

  } else if (role === "Region") {

    content.innerHTML = `
      <h3>🗺️ Панели Region</h3>
      <p>
        Шумо ҳамчун коргари Region ворид шудед.
        Мағозаҳо ва нуқтаҳои вобаста ба
        региони шумо нишон дода мешаванд.
      </p>
    `;

  } else {

    content.innerHTML = `
      <h3>📍 Панели корбар</h3>
      <p>
        Аккаунт бомуваффақият ворид шуд.
      </p>
    `;
  }
}


/* =========================================================
   LOGIN
   ========================================================= */

loginForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    clearMessage();

    let login =
      normalizeLogin(
        loginInput.value
      );

    const password =
      passwordInput.value;


    if (!login || !password) {

      showMessage(
        "Login ва паролро пур кунед."
      );

      return;
    }


    const email =
      LOGIN_EMAILS[login];


    if (!email) {

      showMessage(
        "Login ё парол нодуруст аст."
      );

      return;
    }


    loginButton.disabled = true;

    loginButton.textContent =
      "⏳ Санҷиш...";


    try {

      /* -----------------------------------------
         SUPABASE AUTH LOGIN
         ----------------------------------------- */

      const {
        data: authData,
        error: authError
      } =
        await supabaseClient.auth
          .signInWithPassword({
            email: email,
            password: password
          });


      if (authError) {

        console.error(
          "AUTH ERROR:",
          authError
        );

        showMessage(
          "Login ё парол нодуруст аст."
        );

        return;
      }


      if (!authData?.user) {

        showMessage(
          "Корбар ёфт нашуд."
        );

        return;
      }


      /* -----------------------------------------
         GET LOGIN ACCOUNT
         ----------------------------------------- */

      const {
        data: account,
        error: accountError
      } =
        await supabaseClient
          .from("login_accounts")
          .select(
            "login,email,role,account_type,sector_id,region_id"
          )
          .eq(
            "email",
            email
          )
          .maybeSingle();


      if (accountError) {

        console.error(
          "ACCOUNT ERROR:",
          accountError
        );

        /*
          Auth login already succeeded.
          If RLS blocks login_accounts,
          we still keep the session.
        */

        await showDashboard(
          login,
          {
            login: login,
            email: email,
            role:
              login === "director"
                ? "director"
                : login.startsWith("sup.")
                  ? "supervisor"
                  : "zayavshik",

            account_type:
              login.startsWith("sect.")
                ? "sector"
                : login.startsWith("reg.")
                  ? "region"
                  : login === "director"
                    ? "director"
                    : "supervisor",

            sector_id:
              login.startsWith("sect.")
                ? Number(
                    login.split(".")[1]
                  )
                : null,

            region_id:
              login.startsWith("reg.")
                ? Number(
                    login.split(".")[1]
                  )
                : null
          }
        );

        return;
      }


      if (!account) {

        showMessage(
          "Аккаунти ин Login дар система ёфт нашуд."
        );

        await supabaseClient.auth.signOut();

        return;
      }


      /* -----------------------------------------
         SUCCESS
         ----------------------------------------- */

      showMessage(
        "Воридшавӣ бомуваффақият анҷом ёфт.",
        "success"
      );


      await showDashboard(
        login,
        account
      );


    } catch (error) {

      console.error(
        "LOGIN ERROR:",
        error
      );

      showMessage(
        "Хатогии система. Баъдтар кӯшиш кунед."
      );

    } finally {

      loginButton.disabled = false;

      loginButton.textContent =
        "🔑 Ворид шудан";
    }

  }
);


/* =========================================================
   LOGOUT
   ========================================================= */

logoutButton.addEventListener(
  "click",
  async function() {

    await supabaseClient.auth.signOut();

    dashboard.style.display = "none";

    loginPage.style.display = "block";

    loginForm.reset();

    clearMessage();

  }
);


/* =========================================================
   CHECK EXISTING SESSION
   ========================================================= */

async function checkSession() {

  const {
    data
  } =
    await supabaseClient.auth
      .getSession();


  if (!data?.session) {
    return;
  }


  const user =
    data.session.user;


  const email =
    user.email;


  const login =
    Object.keys(LOGIN_EMAILS)
      .find(
        key =>
          LOGIN_EMAILS[key]
            .toLowerCase() ===
          email.toLowerCase()
      );


  if (!login) {
    return;
  }


  const {
    data: account
  } =
    await supabaseClient
      .from("login_accounts")
      .select(
        "login,email,role,account_type,sector_id,region_id"
      )
      .eq(
        "email",
        email
      )
      .maybeSingle();


  if (account) {

    await showDashboard(
      login,
      account
    );
  }
}


/* =========================================================
   START
   ========================================================= */

checkSession();

</script>

</body>
  </html>
